[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-pbir-mcp"
version = "0.2.0"
description = "MCP server for editing Power BI PBIR report projects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "RZHOU" }
]
keywords = ["mcp", "powerbi", "pbir", "pbip", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bobzhou-source/powerbi-pbir-mcp"
Issues = "https://github.com/bobzhou-source/powerbi-pbir-mcp/issues"

[project.scripts]
powerbi-pbir-mcp = "pbir_mcp_server:run"
powerbi-pbir-mcp-sse = "pbir_mcp_server:run_sse"

[tool.setuptools]
py-modules = ["pbir_mcp_server"]
